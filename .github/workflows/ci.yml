name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  config:
    name: Scripts, Dockerfiles, Caddyfile, Compose, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh runtimes/*.sh
      # DL3018 (pin apk package versions) is ignored: Alpine drops superseded package
      # versions from its repositories, so pins break builds instead of making them reproducible.
      - name: hadolint
        run: |
          for dockerfile in Dockerfile web/Dockerfile runtimes/*/Dockerfile; do
            echo "::group::$dockerfile"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --ignore DL3018 - <"$dockerfile"
            echo "::endgroup::"
          done
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: caddy validate
        run: >-
          docker run --rm -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMAIN=lightning.example.com
          caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet

  runtimes:
    name: Runtime (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, typescript, go, rust, c, cpp, java, ruby, php, bash]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: runtimes
          file: runtimes/${{ matrix.language }}/Dockerfile
          tags: lightning-runtime-${{ matrix.language }}:latest
          load: true
          cache-from: type=gha,scope=runtime-${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.language }}
      - run: bash runtimes/test.sh ${{ matrix.language }}

  integration:
    name: Go integration (real sandboxes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Build python runtime
        uses: docker/build-push-action@v7
        with:
          context: runtimes
          file: runtimes/python/Dockerfile
          tags: lightning-runtime-python:latest
          load: true
          cache-from: type=gha,scope=runtime-python
      - name: Build javascript runtime
        uses: docker/build-push-action@v7
        with:
          context: runtimes
          file: runtimes/javascript/Dockerfile
          tags: lightning-runtime-javascript:latest
          load: true
          cache-from: type=gha,scope=runtime-javascript
      - run: go test -race -tags integration ./...

  e2e:
    name: End-to-end (compose + smoke test)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.local.yaml
      LIGHTNING_LANGUAGES: python,javascript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lightning-api:dev
          load: true
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          tags: lightning-web:dev
          load: true
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,mode=max,scope=e2e-web
      - name: Build python runtime
        uses: docker/build-push-action@v7
        with:
          context: runtimes
          file: runtimes/python/Dockerfile
          tags: lightning-runtime-python:latest
          load: true
          cache-from: type=gha,scope=runtime-python
      - name: Build javascript runtime
        uses: docker/build-push-action@v7
        with:
          context: runtimes
          file: runtimes/javascript/Dockerfile
          tags: lightning-runtime-javascript:latest
          load: true
          cache-from: type=gha,scope=runtime-javascript
      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8088
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
